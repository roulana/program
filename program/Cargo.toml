[workspace]
members = ["programs/*"]
resolver = "2"

# solana-cli 2.3.13's default cargo-build-sbf (platform-tools v1.48, rustc 1.84.1) cannot parse
# blake3's transitive dependency cpufeatures 0.3.1, which requires Cargo's edition2024 feature.
# Pin the newer toolchain (as `cargo build-sbf --tools-version v1.57` does) so `anchor build` picks it up too.
[workspace.metadata.solana]
tools-version = "v1.57"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
